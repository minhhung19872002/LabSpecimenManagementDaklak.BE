name: Deploy Backend to UAT

on:
  push:
    branches:
      - develop
    paths:
      - 'src/**'
      - 'Dockerfile'
      - 'Dockerfile.Migrator'
      - '.deploy-uat/**'
      - '.github/workflows/backend-deploy-uat.yml'
  workflow_dispatch:

concurrency:
  group: deploy-backend-uat
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy backend via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          command_timeout: 20m
          script: backend
