name: Deploy Backend to UAT

# UAT chuyen tu GCP VM (136.110.9.243) sang VPS 45.119.83.83 ngay 2026-08-05,
# roi sang 14.225.83.93 (bluestar01) ngay 2026-08-25.
# May hien tai 4 vCPU / 11GB, nhung VAN khong build tren VM: no chay chung nam
# he thong (BlueDental, BlueIdea, StayHost, FoodSafe, StarLab) nen build tai cho
# se tranh CPU va RAM voi cac he dang phuc vu that.
# Actions build image + push GHCR, VM chi pull.

on:
    push:
        branches: [develop]
        paths:
            - "src/**"
            - "Dockerfile"
            - "Dockerfile.Migrator"
            - ".github/workflows/backend-deploy-uat.yml"
    workflow_dispatch:

concurrency:
    group: deploy-backend-uat
    cancel-in-progress: false

env:
    REGISTRY: ghcr.io
    IMAGE_BASE: ghcr.io/${{ github.repository_owner }}

jobs:
    build-and-deploy:
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: write

        steps:
            - uses: actions/checkout@v4

            - uses: docker/setup-buildx-action@v3

            - name: Dang nhap GHCR
              uses: docker/login-action@v3
              with:
                  registry: ${{ env.REGISTRY }}
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Build + push backend
              uses: docker/build-push-action@v6
              with:
                  context: .
                  file: ./Dockerfile
                  push: true
                  tags: |
                      ${{ env.IMAGE_BASE }}/starlab-backend:uat
                      ${{ env.IMAGE_BASE }}/starlab-backend:${{ github.sha }}
                  cache-from: type=gha
                  cache-to: type=gha,mode=max

            - name: Build + push db-migrator
              uses: docker/build-push-action@v6
              with:
                  context: .
                  file: ./Dockerfile.Migrator
                  push: true
                  tags: |
                      ${{ env.IMAGE_BASE }}/starlab-db-migrator:uat
                      ${{ env.IMAGE_BASE }}/starlab-db-migrator:${{ github.sha }}
                  cache-from: type=gha
                  cache-to: type=gha,mode=max

            - name: Deploy len VM
              env:
                  VM_HOST: ${{ secrets.VM_HOST }}
                  VM_USER: ${{ secrets.VM_USER }}
                  VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
                  GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  mkdir -p ~/.ssh
                  echo "$VM_SSH_KEY" > ~/.ssh/deploy_key
                  chmod 600 ~/.ssh/deploy_key
                  ssh-keyscan -H "$VM_HOST" >> ~/.ssh/known_hosts 2>/dev/null

                  # Key tren VM bi rang buoc forced-command -> chi chay duoc gh-deploy.sh.
                  # "backend" di qua SSH_ORIGINAL_COMMAND, token GHCR di qua stdin.
                  echo "$GHCR_TOKEN" | ssh -i ~/.ssh/deploy_key \
                    -o BatchMode=yes -o ConnectTimeout=20 \
                    "$VM_USER@$VM_HOST" backend

            - name: Kiem tra sau deploy
              run: |
                  for i in $(seq 1 10); do
                    code=$(curl -s -o /dev/null -w '%{http_code}' https://api-uat.tihelab.vn/health || echo 000)
                    echo "lan $i: $code"
                    if [ "$code" = 200 ]; then exit 0; fi
                    sleep 10
                  done
                  echo "api-uat.tihelab.vn/health khong tra ve 200 sau 100s"
                  exit 1
