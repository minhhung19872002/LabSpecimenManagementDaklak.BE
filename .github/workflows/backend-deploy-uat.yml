name: Deploy Backend to UAT

on:
  push:
    branches:
      - develop  # UAT branch
    paths:
      - 'src/**'
      - 'Dockerfile'
      - '.github/workflows/backend-deploy-uat.yml'

  workflow_dispatch:  # Allow manual trigger

env:
  # UAT ACR Configuration (separate from production)
  ACR_SERVER: acrlabspecimenuat.azurecr.io
  ACR_USERNAME: acrlabspecimenuat
  IMAGE_NAME: lab-specimen-backend

  # UAT VM Configuration
  UAT_VM_HOST: 20.205.154.96
  UAT_VM_USER: azureuser

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Log in to Azure Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.ACR_SERVER }}
        username: ${{ env.ACR_USERNAME }}
        password: ${{ secrets.UAT_ACR_PASSWORD }}

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: |
          ${{ env.ACR_SERVER }}/${{ env.IMAGE_NAME }}:latest
          ${{ env.ACR_SERVER }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
        cache-from: type=registry,ref=${{ env.ACR_SERVER }}/${{ env.IMAGE_NAME }}:latest
        cache-to: type=inline

    - name: Deploy to UAT VM via SSH
      uses: appleboy/ssh-action@v1.0.0
      with:
        host: ${{ env.UAT_VM_HOST }}
        username: ${{ env.UAT_VM_USER }}
        key: ${{ secrets.UAT_SSH_PRIVATE_KEY }}
        script: |
          cd /opt/lab-specimen

          # Log in to ACR
          echo "${{ secrets.UAT_ACR_PASSWORD }}" | docker login ${{ env.ACR_SERVER }} -u ${{ env.ACR_USERNAME }} --password-stdin

          # Update backend image in docker-compose
          sed -i 's|image: .*lab-specimen-backend.*|image: ${{ env.ACR_SERVER }}/${{ env.IMAGE_NAME }}:latest|' docker-compose.yml

          # Pull and restart
          docker-compose pull backend
          docker-compose up -d backend

          # Clean up old images
          docker image prune -f

    - name: Verify deployment
      uses: appleboy/ssh-action@v1.0.0
      with:
        host: ${{ env.UAT_VM_HOST }}
        username: ${{ env.UAT_VM_USER }}
        key: ${{ secrets.UAT_SSH_PRIVATE_KEY }}
        script: |
          cd /opt/lab-specimen
          docker-compose ps backend
          docker-compose logs --tail=50 backend
