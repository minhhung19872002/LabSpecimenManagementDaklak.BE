name: Deploy Collabora to AKS

on:
  workflow_dispatch:

env:
  ACR_NAME: acrlabspecimenprod
  RESOURCE_GROUP: rg-lab-specimen-prod
  AKS_CLUSTER_NAME: aks-lab-specimen-prod
  NAMESPACE: lab-specimen

jobs:
  deploy-collabora:
    name: Build and Deploy Collabora
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Get ACR Login Server
        id: acr
        run: |
          ACR_LOGIN_SERVER=$(az acr show --name ${{ env.ACR_NAME }} --resource-group ${{ env.RESOURCE_GROUP }} --query loginServer -o tsv)
          echo "login_server=$ACR_LOGIN_SERVER" >> $GITHUB_OUTPUT

      - name: Build and Push Collabora Image
        run: |
          IMAGE="${{ steps.acr.outputs.login_server }}/lab-specimen-collabora:latest"
          az acr build \
            --registry ${{ env.ACR_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --image lab-specimen-collabora:latest \
            --file Dockerfile.Collabora \
            .
          echo "✅ Collabora image built and pushed: $IMAGE"

      - name: Get AKS Credentials
        run: |
          az aks get-credentials \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --name ${{ env.AKS_CLUSTER_NAME }} \
            --overwrite-existing

      - name: Deploy to AKS
        run: |
          IMAGE="${{ steps.acr.outputs.login_server }}/lab-specimen-collabora:latest"
          kubectl patch deployment lab-specimen-collabora -n ${{ env.NAMESPACE }} \
            --type json \
            -p "[{\"op\":\"replace\",\"path\":\"/spec/template/spec/containers/0/image\",\"value\":\"$IMAGE\"}]"
          kubectl rollout restart deployment/lab-specimen-collabora -n ${{ env.NAMESPACE }}
          echo "✅ Collabora deployed to AKS"

      - name: Logout from Azure
        if: always()
        run: az logout || true
